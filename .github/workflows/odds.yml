
name: Update Sportsbook Odds

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC.
    # Thursday: 12 PM and 6 PM Eastern (EDT)
    - cron: '0 16,22 * * 4'

    # Friday: 12 PM and 6 PM Eastern (EDT)
    - cron: '0 16,22 * * 5'

    # Saturday: Every 2 hours, 10 AM–10 PM Eastern (EDT)
    - cron: '0 14,16,18,20,22,0,2 * * 6,0'

permissions:
  contents: write

concurrency:
  group: saturday-edge-odds
  cancel-in-progress: false

jobs:
  update-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve sportsbook odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update_odds.py

      - name: Commit updated odds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/odds.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update sportsbook odds snapshot"
            git push
          fi
