
name: Update Sportsbook Odds

on:
  workflow_dispatch:
  schedule:
    # Every hour, but only run API requests
    # during selected Eastern Time windows.
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: saturday-edge-odds
  cancel-in-progress: false

jobs:
  update-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Eastern Time schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          weekday = now.weekday()
          hour = now.hour
          month = now.month

          # College football season: August–January.
          in_season = month in (8, 9, 10, 11, 12, 1)

          thursday = weekday == 3 and hour in (12, 18)
          friday = weekday == 4 and hour in (12, 18)
          saturday = weekday == 5 and hour in (
              10, 12, 14, 16, 18, 20, 22
          )

          manual = os.environ["EVENT_NAME"] == "workflow_dispatch"

          allowed = manual or (
              in_season and (thursday or friday or saturday)
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as file:
              file.write(
                  "run_odds=" + str(allowed).lower() + "\n"
              )

          print(
              "Eastern time:", now.isoformat(),
              "| Odds request allowed:", allowed
          )
          PY

      - name: Retrieve sportsbook odds
        if: steps.schedule.outputs.run_odds == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python update_odds.py

      - name: Commit updated odds
        if: steps.schedule.outputs.run_odds == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/odds.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update sportsbook odds snapshot"
            git push
          fi
